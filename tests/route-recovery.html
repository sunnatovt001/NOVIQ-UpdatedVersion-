<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><div id="root"></div><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {RoutePage} from '/src/components/RoutePage.tsx';
import '/src/index.css';
let attempts = 0;
const scenario = new URLSearchParams(location.search).get('case');
const loader = async () => {
  if (++attempts === 1) {
    if (scenario === 'hang') return new Promise(() => {});
    if (scenario === 'import') throw new Error('Injected chunk import error');
  }
  return {FixturePage: () => {
    if (scenario === 'runtime' && attempts === 1) throw new Error('Injected component runtime error');
    return React.createElement('p', null, 'Recovered page');
  }};
};
createRoot(document.getElementById('root')).render(React.createElement(RoutePage,{loader,name:'FixturePage'}));
</script></body></html>
